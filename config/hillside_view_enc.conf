CONFIG_ZMK_KEYBOARD_NAME="Pletnev HSV Enc" # Имя клавиатуры, которое отображается при Bluetooth подключении

CONFIG_EC11=y
# Включаем поддержку энкодеров EC11 (поворотные кодировщики)
# Без этой строки энкодеры на клавиатуре не будут работать
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y
# Энкодеры обрабатываются в глобальном потоке ZMK
# (альтернатива — прерывания, но глобальный поток проще и стабильнее)

CONFIG_ZMK_DISPLAY=y
# Включаем дисплей (nice!view e-ink экран)
# Без этого экран не будет инициализирован
CONFIG_ZMK_RGB_UNDERGLOW=y
# Включаем RGB подсветку (4 LED под клавиатурой)
# Отвечает за декоративную подсветку и реактивный режим

CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
# Дисплей использует отдельный выделенный поток для отрисовки
# (без этого обновления экрана могут тормозить или конфликтровать с другими задачами)

CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
# Увеличиваем мощность Bluetooth передатчика на +8 дБм
# (улучшает дальность и стабильность связи между половинками split-клавиатуры)

# Enable deep sleep support
CONFIG_ZMK_SLEEP=y
# Включаем глубокый сон — клавиатура уходит в спящий режим для экономии батареи
# Без этого батарея будет разряжаться быстрее
# Milliseconds of inactivity before entering deep sleep
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
# Таймер бездействия перед сном: 900000 мс = 15 минут

CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
# Экспериментальные улучшения Bluetooth соединений
# (улучшает стабильность reconnect, но помечено как экспериментальное)

# report peripheral battery level
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
# Центральная половина (левая) опрашивает уровень батареи периферийной (правой)
# (без этого на дисплее не будет показываться батарея правой половинки)
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
# Центральная половина передаёт уровень батареи правой половинки по Bluetooth
# (телефон/компьютер увидит оба уровня батареи)

CONFIG_ZMK_STUDIO=y
# Включаем ZMK Studio — веб-интерфейс для настройки раскладки на лету
# (без этого не будет подключения к studio.zmk.io)
CONFIG_ZMK_STUDIO_LOCKING=n
# Отключаем блокировку Studio
# (когда включено — после подключения по USB Studio блокирует другие изменения;
#  когда выключено — можно менять раскладку без ограничений)

CONFIG_ZMK_STUDIO_RPC_THREAD_STACK_SIZE=8120
# Размер стека потока Studio RPC: 8120 байт
# (увеличен по умолчанию для стабильности; если мало — Studio может вылетать)

CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y
# Включает работу с мышью